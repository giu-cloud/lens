# Sonda veloce: risponde un indirizzo? (per controllare le fonti dei dati prima dei flussi lunghi)
name: sonda
on:
  workflow_dispatch:
    inputs:
      url: {description: "indirizzi separati da spazi", default: ""}
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env: {U: "${{ github.event.inputs.url }}"}
        run: |
          for u in $U; do
            echo "== $u"
            curl -s -m 30 -o /tmp/r -w "codice %{http_code}, %{size_download} byte, %{time_total} s\n" "$u" || echo "errore curl"
            head -c 1500 /tmp/r; echo
          done
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api rate_limit --jq '.resources.core | "richieste rimaste \(.remaining) su \(.limit), si azzera alle \(.reset | todate)"'
