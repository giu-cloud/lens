# Sonda veloce: risponde un indirizzo? (per controllare le fonti dei dati prima dei flussi lunghi)
name: sonda
on:
  workflow_dispatch:
    inputs:
      url: {description: "indirizzi separati da spazi", default: ""}
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for u in ${{ github.event.inputs.url }}; do
            echo "== $u"
            curl -s -m 30 -o /tmp/r -w "codice %{http_code}, %{size_download} byte, %{time_total} s\n" "$u" || echo "errore curl"
            head -c 400 /tmp/r; echo
          done
